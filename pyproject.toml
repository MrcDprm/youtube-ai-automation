[project]
name = "youtube-automation"
version = "1.0.0"
description = "Zero-cost, fully local automated video production pipeline."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "output", ".cache", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # Typer relies on function-call defaults (typer.Option/Argument).
    "RUF001", # Turkish text in literals legitimately contains non-ASCII characters.
    "RUF002",
    "RUF003",
    # int(round(x)) is redundant for builtin floats but not for the numpy scalars MoviePy and
    # Pillow hand back, where round() returns another numpy float. The cast is load-bearing.
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["config", "models", "modules", "utils", "zenn"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
strict_equality = true
show_error_codes = true
exclude = ["^\\.venv/", "^output/", "^\\.cache/"]

[[tool.mypy.overrides]]
module = [
    "moviepy.*",
    "imageio_ffmpeg.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.*",
    "mutagen.*",
    "requests_mock.*",
    "proglog.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
